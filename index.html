<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Навигатор МГСУ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Цвета по эмблеме МГСУ: тёмно-синий #1D3B6F на белом, синий #2E62B0, голубой #4FA3E0.
   --gold оставлен по имени ради совместимости, теперь это голубой акцент. */
:root {
  --navy: #1D3B6F; --blue: #2E62B0; --gold: #4FA3E0; --gold-ink: #FFFFFF; --sky-soft: #E4F0FC;
  --bg: #F3F7FC; --card: #FFFFFF; --card-2: #EEF4FB; --text: #11234A; --muted: #7487A8;
  --line: rgba(29, 59, 111, .09); --accent: var(--navy); --accent-ink: #fff;
  --green: #169EC4; --orange: #F07A2A; --red: #E5484D;
  --glass: rgba(255, 255, 255, .86); --shadow: 0 6px 22px rgba(29, 59, 111, .12);
  --tab: var(--navy); --tab-text: #FFFFFF;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --bg: #0B1830; --card: #13254A; --card-2: #1A3058; --text: #EAF1FB; --muted: #91A3C4; --sky-soft: #1E3963;
  --gold: #6CB8F0; --gold-ink: #0B1830;
  --line: rgba(255, 255, 255, .08); --accent: var(--gold); --accent-ink: var(--gold-ink);
  --green: #3CC4E0; --orange: #FF8A3D; --red: #F87171;
  --glass: rgba(15, 32, 64, .84); --shadow: 0 6px 22px rgba(0, 0, 0, .4);
  --tab: var(--gold); --tab-text: var(--gold-ink);
}
.emb { height: 26px; width: auto; vertical-align: -5px; margin-right: 8px; }
:root[data-theme="dark"] .emb { filter: brightness(0) invert(1); }
.loader .emb-big { position: absolute; height: 54px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }
.glass { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line); box-shadow: var(--shadow); }

/* ---------- экраны ---------- */
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }
.page { overflow-y: auto; height: 100%; padding: 18px 14px calc(96px + var(--safe-b));
  max-width: 560px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
.page h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
.page .lead { color: var(--muted); font-size: 13px; font-weight: 500; margin: 0 0 14px; }
.section { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; margin: 18px 4px 8px; }

/* ---------- карта ---------- */
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl, .pin { position: absolute; left: 0; top: 0; will-change: transform; }
.lbl { white-space: nowrap; pointer-events: auto; font-size: 11px; font-weight: 700; padding: 3px 8px;
  border-radius: 999px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(15, 40, 90, .12); transition: opacity .2s; }
.lbl.small { font-size: 10px; padding: 2px 7px; color: var(--muted); }
.lbl.on { background: var(--navy); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .lbl.on { background: var(--gold); color: var(--gold-ink); }
.lbl.warn { background: var(--orange); color: #2a1200; border-color: transparent; }
.lbl.dim { opacity: .3; }
.lbl.far { opacity: .0; pointer-events: none; }
.pin { pointer-events: none; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 15px;
  padding: 4px 11px; border-radius: 11px; box-shadow: 0 6px 18px rgba(79, 163, 224, .45); white-space: nowrap; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--gold); border-bottom: 0; }
.pin.start { background: var(--green); color: #032318; font-size: 11px; padding: 3px 8px; border-radius: 8px;
  box-shadow: 0 4px 12px rgba(18, 168, 119, .4); }
.pin.start::after { border-top-color: var(--green); }
.pin.stop { background: var(--red); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 8px;
  box-shadow: 0 4px 12px rgba(229, 72, 77, .4); }
.pin.stop::after { border-top-color: var(--red); }

.ui { transition: opacity .25s; }
body.dragging .ui { opacity: .35; }
.top { position: absolute; left: 10px; right: 10px; top: 10px; max-width: 520px; margin: 0 auto; }
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 5px 0 13px; border-radius: 14px; }
.search svg { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text);
  font-size: 15px; font-weight: 600; }
.search input::placeholder { color: var(--muted); font-weight: 500; }
.search .go { height: 34px; padding: 0 13px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 13px; }
.chips { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px; }
.chip.sport { color: var(--orange); }

.tools { position: absolute; right: 10px; top: 104px; display: flex; flex-direction: column; gap: 8px; }
.tool { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
.tool:active, .tg button:active { transform: scale(.94); }
.tool b { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.tg { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; }
.tg button { width: 40px; height: 38px; display: grid; place-items: center; color: var(--text); }
.tg button + button { border-top: 1px solid var(--line); }
.tg.row2 { flex-direction: row; }
.tg.row2 button { width: 20px; }
.tg.row2 button + button { border-top: 0; border-left: 1px solid var(--line); }
#t-north svg { transition: transform .08s linear; }

.floors { position: absolute; left: 10px; top: 104px; display: flex; flex-direction: column; gap: 4px; padding: 5px;
  border-radius: 14px; max-height: calc(100vh - 330px); overflow-y: auto; transition: opacity .25s; }
.floors.hidden { opacity: 0; pointer-events: none; }
.floors .cap { font-size: 9px; font-weight: 800; color: var(--muted); text-align: center; letter-spacing: .06em; padding-top: 2px; }
.floors button { width: 30px; height: 28px; flex: none; border-radius: 9px; font-weight: 700; font-size: 13px; }
.floors .cap { flex: none; }
.floors button.on { background: var(--gold); color: var(--gold-ink); }

.sheet { position: absolute; left: 8px; right: 8px; bottom: calc(66px + var(--safe-b)); max-width: 520px; margin: 0 auto;
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line);
  padding: 6px 14px 12px; max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
  transition: max-height .3s cubic-bezier(.2, .8, .2, 1); }
.sheet.peek { max-height: 92px; overflow: hidden; }
.grab { width: 34px; height: 4px; border-radius: 3px; background: var(--muted); opacity: .35; margin: 2px auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.sheet-head .tt { flex: 1; min-width: 0; }
.sheet h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .sub { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .more { color: var(--muted); transition: transform .25s; }
.sheet:not(.peek) .more { transform: rotate(180deg); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { height: 24px; padding: 0 9px; border-radius: 8px; display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 700; background: var(--card-2); }
.tag.a { background: var(--gold); color: var(--gold-ink); }
.tag.g { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.tag.o { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.steps { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; }
.steps .n { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--navy) 12%, transparent); color: var(--navy); }
:root[data-theme="dark"] .steps .n { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--card-2);
  color: var(--muted); font-size: 12px; line-height: 1.4; }
.note.warn { background: color-mix(in srgb, var(--orange) 12%, transparent); color: var(--text); }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; height: 40px; border-radius: 12px; font-weight: 700; font-size: 14px; background: var(--card-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.html blockquote { margin: 8px 0; padding: 9px 11px; border-radius: 10px; background: var(--card-2);
  border-left: 3px solid var(--gold); }
.html { font-size: 13px; line-height: 1.5; }
.mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.mini { height: 54px; border-radius: 12px; background: var(--card-2); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; }
.mini b { font-size: 10px; color: var(--muted); font-weight: 600; }

/* ---------- карточки ---------- */
.card { background: var(--card); border-radius: 18px; padding: 14px; border: 1px solid var(--line); }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px;
  padding: 11px 12px; border: 1px solid var(--line); text-align: left; width: 100%; transition: transform .15s; }
.item:active, .tile:active { transform: scale(.985); }
.item .t { font-weight: 700; font-size: 14px; }
.item .d { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 1px; line-height: 1.3; }
.item .chev { margin-left: auto; color: var(--muted); }
.abbr { flex: none; min-width: 42px; height: 42px; padding: 0 7px; border-radius: 12px; display: grid;
  place-items: center; font-weight: 800; font-size: 12px; color: var(--navy);
  background: color-mix(in srgb, var(--navy) 10%, transparent); }
:root[data-theme="dark"] .abbr { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.abbr.o { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid var(--line);
  text-align: left; min-height: 108px; display: flex; flex-direction: column; transition: transform .15s; }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; }
.ico svg { width: 18px; height: 18px; }
.tile .t { font-weight: 800; font-size: 14px; margin-top: auto; padding-top: 10px; }
.tile .d { color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 2px; line-height: 1.3; }
.hero { border-radius: 22px; padding: 18px; color: #fff; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, #4FA3E0 0%, #2E62B0 40%, #1D3B6F 100%); }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  border: 10px solid rgba(140, 200, 248, .5); }
.hero h3 { margin: 0; font-size: 19px; font-weight: 800; }
.hero p { margin: 4px 0 0; opacity: .85; font-size: 13px; max-width: 75%; }
.hero .big { font-size: 58px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: 12px; }
.hero .big span { color: var(--gold); }
.hero .cap2 { display: flex; gap: 20px; margin-top: 6px; font-size: 12px; font-weight: 700; }
.hero .cap2 span:last-child { color: var(--gold); }

/* ---------- таббар ---------- */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--safe-b));
  display: flex; gap: 2px; padding: 4px; border-radius: 999px; z-index: 10; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 66px;
  padding: 5px 0 4px; border-radius: 999px; color: var(--muted); font-size: 10px; font-weight: 700; }
.tabbar button svg { width: 19px; height: 19px; }
.tabbar button.on { background: var(--tab); color: var(--tab-text); }

.toast { position: fixed; left: 50%; top: 64px; transform: translate(-50%, -16px); opacity: 0;
  background: var(--navy); color: #fff; padding: 9px 14px; border-radius: 12px; font-weight: 700;
  font-size: 13px; transition: .25s; z-index: 20; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 30;
  transition: opacity .4s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader .ring { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line);
  border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader" id="loader"><img class="emb-big" src="emblem.png" alt=""><div class="ring" style="width:96px;height:96px"></div></div>

<!-- Карта -->
<section class="screen active" id="tab-map">
  <div id="scene"></div>
  <div id="labels"></div>
  <div class="top ui">
    <form class="search glass" id="search" autocomplete="off">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" enterkeyhint="search" placeholder="КМК 415, 511 Г УЛБ, спорткомплекс">
      <button class="go" type="submit">Найти</button>
    </form>
    <div class="chips" id="quick"></div>
  </div>
  <div class="tools ui">
    <button class="tool glass" id="t-north" title="Выровнять: фасад к себе"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 2.5 8.2 12h7.6z" fill="#E5484D" stroke="#E5484D"/><path d="M12 21.5 15.8 12H8.2z" fill="currentColor" opacity=".35" stroke="none"/></svg></button>
    <button class="tool glass" id="t-top" title="2D / 3D"><b>2D</b></button>
    <div class="tg glass">
      <button id="t-in" title="Приблизить"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="t-out" title="Отдалить"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="tg glass row2">
      <button id="t-left" title="Повернуть влево"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="t-right" title="Повернуть вправо"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <button class="tool glass" id="t-home" title="Обзор"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></button>
  </div>
  <div class="floors glass hidden ui" id="floors"></div>
  <div class="sheet peek ui" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
</section>

<section class="screen" id="tab-places"><div class="page" id="places"></div></section>
<section class="screen" id="tab-useful"><div class="page" id="useful"></div></section>
<section class="screen" id="tab-guide"><div class="page" id="guide"></div></section>

<nav class="tabbar glass" id="tabbar">
  <button data-tab="map" class="on"><svg class="i" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Карта</button>
  <button data-tab="places"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg>Корпуса</button>
  <button data-tab="useful"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Полезное</button>
  <button data-tab="guide"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Номера</button>
</nav>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="campus.js"></script>
<script src="app.js"></script>
</body>
</html>
